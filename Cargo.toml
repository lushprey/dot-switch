[package]
name = "dot-switch"
version = "0.1.0"
edition = "2021"
rust-version = "1.74"
description = "Swap ~/.config files between named profiles via symlinks. Built for Hyprland/Quickshell, generic for everything."
license = "MIT"
authors = ["dot-switch contributors"]
homepage = "https://github.com/lushprey/dot-switch"
repository = "https://github.com/lushprey/dot-switch"
readme = "README.md"
keywords = ["dotfiles", "hyprland", "quickshell", "config", "profile"]
categories = ["command-line-utilities", "config"]
exclude = [
    "/.github",
    "/packaging",
    "/assets",
    "/flake.nix",
    "/flake.lock",
    "/dist",
    "/target",
]

[[bin]]
name = "dot-switch"
path = "src/main.rs"

[lib]
name = "dot_switch"
path = "src/lib.rs"

[dependencies]
# CLI parsing (auto-provides --help / -h)
clap = { version = "4.5", features = ["derive", "cargo", "wrap_help"] }
clap_complete = "4.5"

# Serialization
serde = { version = "1", features = ["derive"] }
serde_json = "1"
toml = "0.8"

# Paths / XDG
dirs = "5"

# Errors / logging
anyhow = "1"
thiserror = "1"
tracing = "0.1"
tracing-subscriber = { version = "0.3", features = ["env-filter", "fmt"] }

# TUI
ratatui = "0.28"
crossterm = "0.28"

# Glob matching for reload_on_files
glob = "0.3"

# Misc utils
shellexpand = "3"
chrono = { version = "0.4", default-features = false, features = ["clock"] }
uuid = { version = "1", features = ["v4"] }

[dev-dependencies]
tempfile = "3"
assert_cmd = "2"

[profile.release]
opt-level = 3
lto = "thin"
codegen-units = 1
strip = true

# The profile that 'dist' will build with
[profile.dist]
inherits = "release"
lto = "thin"

# cargo-binstall — precompiled binary install support.
# URL layout must match the artifact names produced by cargo-dist:
#   dot-switch-v{version}-{target}.tar.gz  (binaries at archive root)
# (Windows artifacts are .zip — Windows users should use install.ps1 instead.)
[package.metadata.binstall]
pkg-url = "{ repo }/releases/download/v{ version }/dot-switch-v{ version }-{ target }{ archive-suffix }"
bin-dir = "{ bin }{ binary-ext }"
pkg-fmt = "tgz"
disabled-strategies = ["quick-install", "compile"]

[package.metadata.binstall.formats]
unix-archive = ".tar.gz"

[package.metadata.wix]
upgrade-guid = "889AA458-5B92-4801-8CA7-A68C539A5990"
path-guid = "732BDE16-99F4-4AC4-A504-F8DBEE00A7B6"
license = false
eula = false
