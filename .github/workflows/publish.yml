# ─────────────────────────────────────────────────────────────────────────────
# Publish dot-switch to crates.io, sync AUR package, and update Homebrew tap
# on every release tag (v*).
#
# Required secrets (configure under Settings → Secrets and variables → Actions):
#   CARGO_REGISTRY_TOKEN  — crates.io publish token (scoped: publish-new)
#   AUR_SSH_PRIVATE_KEY   — private key for pushing to AUR
#   HOMEBREW_TAP_TOKEN    — PAT with push to lushprey/homebrew-tap repo
# ─────────────────────────────────────────────────────────────────────────────
name: publish

on:
  release:
    types: [published]
  workflow_dispatch:
    inputs:
      tag:
        description: "Tag to publish (e.g. v0.1.0)"
        required: true

permissions:
  contents: read

jobs:
  # ── 1. crates.io ──────────────────────────────────────────────────────────
  publish-crates:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ inputs.tag || github.ref }}

      - uses: dtolnay/rust-toolchain@stable

      - name: cargo login
        run: cargo login ${{ secrets.CARGO_REGISTRY_TOKEN }}

      - name: Dry-run publish
        run: cargo publish --dry-run

      - name: Publish to crates.io
        run: cargo publish

  # ── 2. AUR (dot-switch-bin) ───────────────────────────────────────────────
  publish-aur:
    needs: publish-crates
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ inputs.tag || github.ref }}

      - name: Parse version from tag
        id: ver
        run: |
          TAG="${{ inputs.tag || github.ref_name }}"
          VERSION="${TAG#v}"
          echo "version=$VERSION" >> "$GITHUB_OUTPUT"
          echo "tag=$TAG"        >> "$GITHUB_OUTPUT"

      - name: Compute checksums for the GitHub Release artifacts
        id: sums
        run: |
          V="${{ steps.ver.outputs.version }}"
          BASE="https://github.com/lushprey/dot-switch/releases/download/v${V}"

          curl -fsSL "$BASE/dot-switch-v${V}-x86_64-unknown-linux-musl.tar.gz" \
            | sha256sum | awk '{print $1}' | tee x86_64.sha
          curl -fsSL "$BASE/dot-switch-v${V}-aarch64-unknown-linux-musl.tar.gz" \
            | sha256sum | awk '{print $1}' | tee aarch64.sha

          echo "x86_64=$(cat x86_64.sha)"   >> "$GITHUB_OUTPUT"
          echo "aarch64=$(cat aarch64.sha)" >> "$GITHUB_OUTPUT"

      - name: Render PKGBUILD
        run: |
          V="${{ steps.ver.outputs.version }}"
          X64="${{ steps.sums.outputs.x86_64 }}"
          ARM="${{ steps.sums.outputs.aarch64 }}"

          mkdir -p aur-out
          sed -e "s|%%VERSION%%|$V|g" \
              -e "s|%%SHA_X86_64%%|$X64|g" \
              -e "s|%%SHA_AARCH64%%|$ARM|g" \
              packaging/aur/PKGBUILD > aur-out/PKGBUILD

          # .SRCINFO is generated from PKGBUILD via `makepkg --printsrcinfo`
          # but we ship a pre-rendered template that is also substituted:
          sed -e "s|%%VERSION%%|$V|g" \
              -e "s|%%SHA_X86_64%%|$X64|g" \
              -e "s|%%SHA_AARCH64%%|$ARM|g" \
              packaging/aur/SRCINFO > aur-out/.SRCINFO

      - name: Push to AUR
        env:
          AUR_SSH_PRIVATE_KEY: ${{ secrets.AUR_SSH_PRIVATE_KEY }}
        run: |
          mkdir -p ~/.ssh
          printf '%s\n' "$AUR_SSH_PRIVATE_KEY" > ~/.ssh/aur_key
          chmod 600 ~/.ssh/aur_key
          ssh-keyscan -t ed25519,rsa aur.archlinux.org >> ~/.ssh/known_hosts

          cat > ~/.ssh/config <<'EOF'
          Host aur.archlinux.org
            IdentityFile ~/.ssh/aur_key
            User aur
            StrictHostKeyChecking no
          EOF

          git clone ssh://aur@aur.archlinux.org/dot-switch-bin.git aur-repo
          cp aur-out/PKGBUILD aur-out/.SRCINFO aur-repo/
          cd aur-repo
          git config user.email "github-actions@lushprey.dev"
          git config user.name  "github-actions"
          git add PKGBUILD .SRCINFO
          git commit -m "Update to v${{ steps.ver.outputs.version }}"
          git push origin master

  # ── 3. Homebrew tap ──────────────────────────────────────────────────────
  publish-homebrew:
    needs: publish-crates
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ inputs.tag || github.ref }}

      - name: Parse version
        id: ver
        run: |
          TAG="${{ inputs.tag || github.ref_name }}"
          VERSION="${TAG#v}"
          echo "version=$VERSION" >> "$GITHUB_OUTPUT"

      - name: Update Homebrew tap formula
        uses: actions/checkout@v4
        with:
          repository: lushprey/homebrew-tap
          token: ${{ secrets.HOMEBREW_TAP_TOKEN }}
          path: tap

      - name: Write Formula
        run: |
          V="${{ steps.ver.outputs.version }}"
          BASE="https://github.com/lushprey/dot-switch/releases/download/v${V}"

          mkdir -p tap/Formula
          cat > tap/Formula/dot-switch.rb <<EOF
          class DotSwitch < Formula
            desc "Swap ~/.config files between named profiles via symlinks"
            homepage "https://github.com/lushprey/dot-switch"
            url "$BASE/dot-switch-v${V}-x86_64-unknown-linux-musl.tar.gz"
            version "${V}"
            sha256 "$(curl -fsSL "$BASE/dot-switch-v${V}-x86_64-unknown-linux-musl.tar.gz" | sha256sum | awk '{print $1}')"
            license "MIT"

            on_macos do
              url "$BASE/dot-switch-v${V}-aarch64-apple-darwin.tar.gz"
              sha256 "$(curl -fsSL "$BASE/dot-switch-v${V}-aarch64-apple-darwin.tar.gz" | sha256sum | awk '{print $1}')"
            end

            def install
              bin.install "dot-switch"
            end

            test do
              assert_match version.to_s, shell_output("#{bin}/dot-switch --version")
            end
          end
          EOF

      - name: Commit & push formula
        working-directory: tap
        run: |
          git config user.email "github-actions@lushprey.dev"
          git config user.name  "github-actions"
          git add Formula/dot-switch.rb
          git commit -m "dot-switch ${V}" || echo "no changes"
          git push
