# ─────────────────────────────────────────────────────────────────────────────
# cargo-dist — automated, cross-compiled release builds to GitHub Releases.
# Generated by `cargo dist init` (axodotdev/cargo-dist v0.25.1).
#
# Triggers on every tag matching `v*` and on every PR (plan-only).
# Produces binaries for the targets listed in `Cargo.toml` -> [workspace.metadata.dist].
# ─────────────────────────────────────────────────────────────────────────────
name: release

# This gets run on every push to main / every PR; it does a `cargo dist plan`
# (no uploads) to surface problems early.
on:
  push:
    branches: ["main", "master"]
    tags: ["v[0-9]*"]
  pull_request:

permissions:
  contents: write

jobs:
  # Plan-only run on PRs / push to non-tag refs.
  plan:
    runs-on: ubuntu-latest
    if: ${{ !startsWith(github.ref, 'refs/tags/') }}
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - uses: actions-rust/cargo@v1
        with:
          command: install
          args: cargo-dist@0.25.1 --locked
      - name: cargo dist plan
        run: cargo dist plan --output-format=json > dist-plan.json
      - name: Upload plan artifact
        uses: actions/upload-artifact@v4
        with:
          name: dist-plan
          path: dist-plan.json

  # The real build + publish, only on tag push (v*).
  build:
    runs-on: ubuntu-latest
    if: ${{ startsWith(github.ref, 'refs/tags/') }}
    needs: []
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Install cargo-dist
        uses: actions-rust/cargo@v1
        with:
          command: install
          args: cargo-dist@0.25.1 --locked

      - name: Install Rust toolchain (stable)
        uses: dtolnay/rust-toolchain@stable

      - name: Add musl targets
        run: |
          rustup target add x86_64-unknown-linux-musl
          rustup target add aarch64-unknown-linux-musl

      - name: Add Apple targets
        run: |
          rustup target add x86_64-apple-darwin
          rustup target add aarch64-apple-darwin

      - name: Install cross-compilation toolchains
        run: |
          sudo apt-get update
          sudo apt-get install -y \
            musl-tools \
            gcc-aarch64-linux-gnu \
            gcc-mingw-w64 \
            upx-ucl

      - name: Generate shell completions + man page into assets/
        run: |
          cargo build --release --bin dot-switch
          mkdir -p assets/completions assets/man
          ./target/release/dot-switch completions bash > assets/completions/dot-switch.bash
          ./target/release/dot-switch completions zsh  > assets/completions/_dot-switch
          ./target/release/dot-switch completions fish > assets/completions/dot-switch.fish

      - name: Run cargo-dist (build + upload to GitHub Releases)
        run: cargo dist host --target=all --output-format=json
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}

      - name: Upload artifacts
        uses: actions/upload-artifact@v4
        with:
          name: dist-artifacts
          path: |
            dist/
            assets/
